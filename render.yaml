# Blueprint de Render para el Conciliador EO / SO.
# Con este archivo, Render crea el servicio web con la configuración correcta
# sin escribirlas a mano: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: conciliacion-eo-so
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # uv ya viene instalado en Render cuando el repositorio tiene uv.lock.
    buildCommand: uv sync --frozen --no-dev
    # Un solo proceso con hilos: el plan Free tiene 512 MB y así no se duplica el
    # Excel en memoria. El análisis de IA de los 89 cruces puede tardar más que
    # los 30 s por defecto de gunicorn, por eso el timeout sube a 180 s.
    startCommand: uv run --frozen --no-dev gunicorn wsgi:app --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 8 --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /
    envVars:
      # Clave de las sesiones de Flask: Render la genera y la guarda.
      - key: SECRET_KEY
        generateValue: true
      # Se pide en el panel de Render; nunca se escribe en el repositorio.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
